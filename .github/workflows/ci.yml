name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Bluetooth build dependency
        run: brew install blueutil
      - name: Unit and rendering checks
        run: ./test.sh
      - name: Build and verify signed bundle
        run: ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Controller-Desk-macOS
          path: dist/Controller Desk.zip
